name: Test and publish compact images
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['images/**', 'modules/web/**', '.github/workflows/images.yml', '.dockerignore']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
  packages: write
concurrency:
  group: compact-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
  build:
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        component: [mpd, upmpdcli, soloist, web]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build locally for validation
        run: docker build --build-arg TARGETARCH=${{ matrix.arch }} -f images/${{ matrix.component }}/Dockerfile -t hifi-${{ matrix.component }}:test .
      - name: Size gate and version smoke
        run: python3 images/check.py ${{ matrix.component }} hifi-${{ matrix.component }}:test
      - name: Bound MPD HTTP playback memory
        if: matrix.component == 'mpd'
        run: python3 tests/mpd_memory_ci.py hifi-mpd:test
      - name: MP3 HTTP playback and seek regression
        if: matrix.component == 'mpd'
        run: python3 tests/mpd_mp3_ci.py hifi-mpd:test --report mp3-report.json
      - uses: actions/upload-artifact@v4
        if: always() && matrix.component == 'mpd'
        with:
          name: mp3-${{ matrix.arch }}
          path: mp3-report.json
          retention-days: 3
      - name: Export validated ARM64 image for device bootstrap
        if: matrix.arch == 'arm64'
        run: docker save hifi-${{ matrix.component }}:test | gzip -1 > image-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: bootstrap-${{ matrix.component }}-arm64
          path: image-arm64.tar.gz
          retention-days: 3
          compression-level: 0
      - name: Publish validated architecture
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          build_ref="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          ref="ghcr.io/${repo}/${{ matrix.component }}:${build_ref}-${{ matrix.arch }}"
          docker tag hifi-${{ matrix.component }}:test "$ref"
          docker push "$ref"
      - uses: actions/upload-artifact@v4
        with:
          name: size-${{ matrix.component }}-${{ matrix.arch }}
          path: image-report.json
  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [mpd, upmpdcli, soloist, web]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}/${{ matrix.component }}"
          build_ref="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          release_ref="${build_ref}-${GITHUB_RUN_ATTEMPT}"
          tags=(-t "$image:$release_ref")
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(-t "$image:$GITHUB_SHA" -t "$image:stable")
          fi
          docker buildx imagetools create "${tags[@]}" "$image:$build_ref-amd64" "$image:$build_ref-arm64"
