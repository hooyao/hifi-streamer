schema: spec-driven

context: |
  Canonical artifact language: English.
  Maintain a matching Simplified Chinese .zh-CN.md edition for every project document.
  Add reciprocal English / Simplified Chinese links at the top of each document.
  Delta spec translations belong in translations/zh-CN/specs/ within their change; only canonical spec.md belongs in the parsed specs/ tree.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English in both editions.
  Code comments and docstrings must be English.
  Document reproducible behavior and acceptance criteria; do not include conversation transcripts or personal event logs.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
