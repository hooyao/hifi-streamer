schema: spec-driven

context: |
  All content under openspec/ must be English only.
  Do not create Chinese editions, translation directories or language-switch links in openspec/.
  Product and contributor documentation outside openspec/ requires English and Simplified Chinese editions with reciprocal language links.
  Code comments and docstrings must be English.
  Document reproducible behavior and acceptance criteria; do not include conversation transcripts or personal event logs.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
